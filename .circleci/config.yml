version: 2.1

# The native wrapper (D2Map.DllWrapper) is a Win32 C++ project and needs Visual Studio's MSBuild with
# the C++ toolset, which rules out the Linux .NET SDK image D2NG uses. The Windows executor ships
# Visual Studio 2022 Build Tools (MSBuild 17.14). Only the 10.0.1xx band of the .NET 10 SDK loads
# under that MSBuild, later bands require MSBuild 18, so that band is installed explicitly.
orbs:
  win: circleci/windows@5.0

jobs:
  build:
    executor:
      name: win/default
      size: medium
    steps:
      - checkout
      - run:
          name: Install .NET 10 SDK (10.0.1xx band)
          command: |
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
            ./dotnet-install.ps1 -Channel 10.0.1xx -InstallDir "$env:USERPROFILE\dotnet"
            & "$env:USERPROFILE\dotnet\dotnet.exe" --version
      - run:
          name: Build solution (Release, x86)
          command: |
            $env:DOTNET_ROOT = "$env:USERPROFILE\dotnet"
            $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
            if (-not $msbuild) { throw "MSBuild not found" }
            Write-Host "Using $msbuild"
            # The project files pin the toolset of the developer machine; the image has v143.
            & $msbuild D2Map.sln -restore -p:Configuration=Release -p:Platform=x86 -p:PlatformToolset=v143 -m -v:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_artifacts:
          path: D2Map.DllWrapper\Release\D2Map.DllWrapper.dll
          destination: D2Map.DllWrapper.dll

workflows:
  build:
    jobs:
      - build
